// Supabase sync functions
// ══════════════════════════════════════════
async function loadFromDB(){
  try{
    const{data,error}=await supabase.from("schedule_data").select("data").eq("id","main").single();
    if(error||!data||!data.data||Object.keys(data.data).length===0)return null;
    return data.data;
  }catch(e){return null;}
}

async function saveToDB(schedData){
  try{
    const{error}=await supabase.from("schedule_data").upsert({id:"main",data:schedData,updated_at:new Date().toISOString()});
    return !error;
  }catch(e){return false;}
}

function subscribeToChanges(callback){
  return supabaseClient.channel("schedule_changes")
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"schedule_data"},payload=>{
      if(payload.new&&payload.new.data) callback(payload.new.data);
    })
    .subscribe();
}
