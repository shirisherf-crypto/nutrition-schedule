async function dbLoad(id){

    const {data,error}=await sb.from("schedule_data").select("data").eq("id",id).single();

}
async function dbSave(id,d){

}
function dbSub(id,cb){

      if(p.new&&p.new.id===id&&p.new.data)cb(p.new.data);
    }).subscribe();
}

// ══ Color helpers ══
function getStaffColor(lecName, staffColors){
  if(!lecName||!staffColors)return{c:"#6B7280",bg:"#F3F4F6"};
  // exact match first
  if(staffColors[lecName])return{c:staffColors[lecName].c,bg:staffColors[lecName].bg};
  // partial match
  for(const[k,v]of Object.entries(staffColors)){
    if(lecName.includes(k)||k.includes(lecName))return{c:v.c,bg:v.bg};
  }
  return{c:"#6B7280",bg:"#F3F4F6"};
}
function isStaffMember(lecName, staffColors){
  if(!lecName||!staffColors)return false;
  if(staffColors[lecName])return true;
  for(const k of Object.keys(staffColors)){
    if(lecName.includes(k)||k.includes(lecName))return true;
  }
  return false;
}

// ══ Compute semesters per lecturer from sched ══
function computeLecSemesters(sched){
  const map={};
  YTABS.forEach(tab=>{
    const yd=sched[tab.id]||{};
    DAYS.forEach(day=>{
      (yd[day]||[]).forEach(c=>{
        if(!c||!c.lec)return;
        const key=c.lec;
        if(!map[key])map[key]=new Set();
        map[key].add(tab.sem);
      });
    });
  });
  const result={};
  for(const[k,v]of Object.entries(map))result[k]=[...v].sort().join(", ");
  return result;
}

function getConflicts(sched,staffColors){
  const m={};
  YTABS.forEach(t=>{const yd=sched[t.id];if(!yd)return;const sem=t.id.slice(-1);DAYS.forEach(day=>{(yd[day]||[]).forEach(c=>{if(!c||!c.lec||!isStaffMember(c.lec,staffColors))return;for(let hh=c.startH;hh<c.endH;hh++){const k=sem+"|"+c.lec+"|"+day+"|"+hh;if(!m[k])m[k]=[];m[k].push({yid:t.id,course:c.course,startH:c.startH});}});});});
  const seen=new Set();
  return Object.entries(m).filter(([,s])=>s.length>1).map(([k,slots])=>{const[sem,lec,day]=k.split("|");const uk=sem+"|"+lec+"|"+day+"|"+slots[0].startH;if(seen.has(uk))return null;seen.add(uk);return{sem,lec,day,slots};}).filter(Boolean);
}

function StatsPanel({staff,sched,staffColors,onUpdate}){
  const lecSems=useMemo(()=>computeLecSemesters(sched),[sched]);

  const upField=(si,section,idx,field,val)=>{
    const next=JSON.parse(JSON.stringify(staff));
    next[si][section][idx][field]=field==="n"||field==="dept"||field==="sem"?val:(parseFloat(val)||0);
    onUpdate(next);
  };
  const addRow=(si,section)=>{
    const next=JSON.parse(JSON.stringify(staff));
    if(section==="courses")next[si].courses.push({n:"קורס חדש",ss:2,sem:""});
    else if(section==="ext")next[si].ext.push({n:"קורס חדש",dept:"",ss:2,sem:""});
    else next[si].bonuses.push({n:"גמול תפקיד",ss:1});
    onUpdate(next);
  };
  const delRow=(si,section,idx)=>{
    const next=JSON.parse(JSON.stringify(staff));next[si][section].splice(idx,1);onUpdate(next);
  };
  const upNote=(si,val)=>{const next=JSON.parse(JSON.stringify(staff));next[si].note=val;onUpdate(next);};
  const upName=(si,val)=>{const next=JSON.parse(JSON.stringify(staff));next[si].name=val;onUpdate(next);};
  const addStaff=()=>{
    const next=JSON.parse(JSON.stringify(staff));

// ══ Backup Modal ══
function BackupModal({acY,sched,staff,banners,staffColors,onRestore,onClose}){
  const[msg,setMsg]=useState("");
  const doExport=()=>{
    const yk=getYK(acY);
    const bk={year:acY,yearKey:yk,date:new Date().toISOString(),sched,staff,banners,staffColors};
    const blob=new Blob([JSON.stringify(bk,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download="backup_"+yk+"_"+new Date().toLocaleDateString("he-IL").replace(/\//g,"-")+".json";
    a.click();URL.revokeObjectURL(url);setMsg("הגיבוי הורד!");
  };
  const doImport=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d.sched&&!d.staff)throw new Error("קובץ לא תקין");onRestore(d);setMsg("השחזור הצליח!");}catch(err){setMsg("שגיאה: "+err.message);}};
    reader.readAsText(file);

    h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)"},onClick:onClose}),
    h("div",{style:{position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",background:"#fff",borderRadius:16,padding:24,width:360,maxWidth:"94vw",zIndex:51,direction:"rtl",boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},h("div",{style:{fontWeight:700,fontSize:15,color:"#3B0764"}},"גיבוי ושחזור"),h("button",{onClick:onClose,style:{background:"none",border:"none",fontSize:20,color:"#9CA3AF"}},"✕")),
      h("div",{style:{fontSize:11,color:"#6B7280",marginBottom:14,background:"#F9FAFB",borderRadius:8,padding:"8px 12px",lineHeight:1.7}},"לפני כל עדכון קובץ — גבי! אם משהו השתבש — שחזרי מהקובץ."),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}},
        h("button",{onClick:doExport,style:{padding:"14px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#059669,#065F46)",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",textAlign:"center"}},h("div",{style:{fontSize:20,marginBottom:4}},"⬇️"),h("div",null,"גיבוי")),
        h("label",{style:{padding:"14px",borderRadius:10,border:"2px dashed #7C3AED",background:"#F5F3FF",color:"#5B21B6",fontSize:13,fontWeight:700,cursor:"pointer",textAlign:"center",display:"block"}},h("div",{style:{fontSize:20,marginBottom:4}},"⬆️"),h("div",null,"שחזור"),h("input",{type:"file",accept:".json",onChange:doImport,style:{display:"none"}}))),
      msg&&h("div",{style:{padding:"8px 12px",borderRadius:8,background:msg.includes("שגיאה")?"#FEF2F2":"#F0FDF4",color:msg.includes("שגיאה")?"#991B1B":"#166534",fontSize:12,fontWeight:600,textAlign:"center"}},msg)));
