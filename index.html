  return h("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#1e0a40,#3b1580,#1e0a40)"}},
    h("div",{style:{background:"rgba(255,255,255,0.09)",backdropFilter:"blur(12px)",borderRadius:18,padding:"32px 36px",width:340,border:"1px solid rgba(255,255,255,0.15)"}},
      h("div",{style:{textAlign:"center",marginBottom:22}},h("div",{style:{fontSize:36,marginBottom:8}},"📅"),h("div",{style:{color:"#fff",fontWeight:700,fontSize:17,marginBottom:3}},"מערכת ניהול שעות"),h("div",{style:{color:"rgba(255,255,255,0.5)",fontSize:11}},"המחלקה למדעי התזונה")),
      h("div",{style:{color:"rgba(255,255,255,0.65)",fontSize:11,fontWeight:600,marginBottom:5}},"מייל ארגוני"),
      h("input",{type:"email",value:e,placeholder:"name@ariel.ac.il",onChange:ev=>{se(ev.target.value);serr("");},onKeyDown:ev=>{if(ev.key==="Enter")go();},style:{width:"100%",padding:"10px 12px",borderRadius:9,border:"1.5px solid "+(err?"#f87171":"rgba(255,255,255,0.2)"),background:"rgba(255,255,255,0.08)",color:"#fff",fontSize:13,outline:"none",boxSizing:"border-box",direction:"ltr",textAlign:"left",marginBottom:err?3:13}}),
      err&&h("div",{style:{color:"#f87171",fontSize:11,marginBottom:10}},err),
      h("button",{onClick:go,disabled:ld,style:{width:"100%",padding:"10px",borderRadius:9,border:"none",background:"linear-gradient(135deg,#7C3AED,#4C1D95)",color:"#fff",fontSize:13,fontWeight:700,opacity:ld?.7:1}},ld?"מתחבר...":"כניסה"),
      h("div",{style:{color:"rgba(255,255,255,0.25)",fontSize:10,textAlign:"center",marginTop:12}},"גישה מורשית לסגל בלבד")));
}

function App(){

  const[user,sUser]=useState(null);
  const[sched,setSched]=useState(fresh);
  const[staff,setStaff]=useState(()=>JSON.parse(JSON.stringify(DEFAULT_STAFF)));
  const[banners,setBanners]=useState(()=>JSON.parse(JSON.stringify(DEFAULT_BANNERS)));
  const[sc,setSc]=useState(()=>JSON.parse(JSON.stringify(DEFAULT_STAFF_COLORS)));
  const[zoomDays,setZoomDays]=useState(()=>JSON.parse(JSON.stringify(DEFAULT_ZOOM)));
  const[dbSt,setDbSt]=useState("loading");
  const[ay,sAy]=useState("y1a");

  const[acY,sAcY]=useState(AYS[0]);

  useEffect(()=>{const yk=getYK(acY);const ch=dbSub("sched_"+yk,nd=>setSched(nd));return()=>sb.removeChannel(ch);},[acY]);
  useEffect(()=>{const yk=getYK(acY);const ch=dbSub("staff_"+yk,nd=>setStaff(nd));return()=>sb.removeChannel(ch);},[acY]);

  const saveStaffDB=useCallback((nd)=>{clearTimeout(staffTimer.current);setSaving(true);staffTimer.current=setTimeout(async()=>{const yk=getYK(acY);const ok=await dbSave("staff_"+yk,nd);setSaving(false);setDbSt(ok?"ok":"error");},700);},[acY]);
  const saveBannersDB=useCallback((nd)=>{const yk=getYK(acY);dbSave("banners_"+yk,nd);},[acY]);

  const cfls=useMemo(()=>getConflicts(sched,sc),[sched,sc]);
  const cSet=useMemo(()=>{const s=new Set();cfls.forEach(c=>c.slots.forEach(sl=>s.add(c.sem+"|"+c.lec+"|"+c.day+"|"+sl.startH)));return s;},[cfls]);
  const cYids=useMemo(()=>{const s=new Set();cfls.forEach(c=>c.slots.forEach(sl=>s.add(sl.yid)));return s;},[cfls]);

  const handleSave=useCallback((day,form)=>{setSched(prev=>{const yd=Object.assign({},prev[ay]);const ex=(yd[day]||[]).filter(c=>c!==modal.cell);ex.push(form);ex.sort((a,b)=>a.startH-b.startH);yd[day]=ex;const next=Object.assign({},prev,{[ay]:yd});saveSchedDB(next);return next;});sModal(null);},[ay,modal,saveSchedDB]);
  const handleDelete=useCallback((day,cell)=>{setSched(prev=>{const yd=Object.assign({},prev[ay]);yd[day]=(yd[day]||[]).filter(c=>c!==cell);const next=Object.assign({},prev,{[ay]:yd});saveSchedDB(next);return next;});sModal(null);},[ay,saveSchedDB]);

  const handleScSave=useCallback((newSc)=>{setSc(newSc);saveScDB(newSc);setColorsModal(false);},[saveScDB]);
  const handleToggleZoom=useCallback((yid,day)=>{setZoomDays(prev=>{const cur=(prev[yid])||(YTABS.find(t=>t.id===yid)?.zD||[]);const next={...prev,[yid]:cur.includes(day)?cur.filter(d=>d!==day):[...cur,day]};saveZoomDB(next);return next;});},[saveZoomDB]);
  const handleRestore=useCallback((data)=>{const yk=getYK(acY);if(data.sched){setSched(data.sched);dbSave("sched_"+yk,data.sched);}if(data.staff){setStaff(data.staff);dbSave("staff_"+yk,data.staff);}if(data.banners){setBanners(data.banners);dbSave("banners_"+yk,data.banners);}if(data.staffColors){setSc(data.staffColors);dbSave("staffcolors_"+yk,data.staffColors);}if(data.zoomDays){setZoomDays(data.zoomDays);dbSave("zoom_"+yk,data.zoomDays);}setBackup(false);},[acY]);

  const bsc=YTABS.filter(t=>t.deg==="תואר ראשון"),msc=YTABS.filter(t=>t.deg==="תואר שני");
  const curTab=YTABS.find(t=>t.id===ay);
  const staffNames=Object.keys(sc||{});

  const pdfItems=[
    {label:"── לפי שנתון ──",fn:null},
    {label:"תואר ראשון",fn:null},
    ...bsc.map(t=>({label:t.lbl,fn:()=>exportPDF(t.id,sched,banners,sc,zoomDays,t.lbl,acY)})),
    {label:"תואר שני",fn:null},
    ...msc.map(t=>({label:t.lbl,fn:()=>exportPDF(t.id,sched,banners,sc,zoomDays,t.lbl,acY)})),
    {label:"── לפי מרצה ──",fn:null},
    ...staff.map(s=>({label:(sc[s.name]&&sc[s.name].full)||s.name,fn:()=>exportLecturerPDF(s.name,staff,sc,acY)})),
  ];

  const dot=h("span",{style:{width:8,height:8,borderRadius:"50%",display:"inline-block",background:saving?"#FCD34D":dbSt==="ok"?"#34D399":"#F87171",marginLeft:4}});

  return h("div",{style:{minHeight:"100vh",background:"#F0EDFF"}},
    h("div",{style:{background:"linear-gradient(120deg,#2d0a5c,#4C1D95,#5B21B6)",padding:"0 14px",display:"flex",alignItems:"center",justifyContent:"space-between",height:50}},
      h("div",{style:{display:"flex",alignItems:"center",gap:10}},h("span",{style:{fontSize:20}},"📅"),h("div",null,h("div",{style:{display:"flex",alignItems:"center",gap:8}},h("span",{style:{color:"#fff",fontWeight:700,fontSize:14}},"מערכת ניהול שעות"),h("select",{value:acY,onChange:e=>sAcY(e.target.value),style:{background:"rgba(255,255,255,0.15)",border:"1px solid rgba(255,255,255,0.25)",borderRadius:99,color:"#E9D5FF",fontSize:11,fontWeight:600,padding:"2px 8px",outline:"none"}},AYS.map(y=>h("option",{key:y,value:y,style:{background:"#3B0764",color:"#fff"}},y)))),h("div",{style:{color:"rgba(255,255,255,0.45)",fontSize:10}},"המחלקה למדעי התזונה - אוניברסיטת אריאל"))),
      h("div",{style:{display:"flex",alignItems:"center",gap:8}},h("div",{style:{display:"flex",alignItems:"center",fontSize:10,color:"rgba(255,255,255,0.6)"}},dot,saving?"שומר...":dbSt==="ok"?"מסונכרן":"שגיאה"),cfls.length>0&&h("button",{onClick:()=>sView("conflicts"),style:{background:"#EF4444",border:"none",borderRadius:99,padding:"3px 9px",color:"#fff",fontSize:11,fontWeight:700}},"⚠ "+cfls.length),h("span",{style:{color:"rgba(255,255,255,0.5)",fontSize:10}},user.split("@")[0]),h("button",{onClick:()=>sUser(null),style:{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",color:"#fff",borderRadius:7,padding:"3px 9px",fontSize:11}},"יציאה"))),
    h("div",{style:{background:"#fff",borderBottom:"1.5px solid #EDE9FE",overflowX:"auto"}},
      h("div",{style:{display:"flex",alignItems:"stretch",padding:"0 10px",minWidth:"max-content"}},
        h("span",{style:{alignSelf:"center",fontSize:10,color:"#9CA3AF",fontWeight:600,padding:"0 8px 0 2px",whiteSpace:"nowrap"}},"תואר ראשון"),
        bsc.map(t=>{const active=ay===t.id&&view==="schedule";return h("button",{key:t.id,onClick:()=>{sAy(t.id);sView("schedule");},style:{padding:"9px 9px",border:"none",background:"none",fontSize:11,fontWeight:600,whiteSpace:"nowrap",color:active?"#5B21B6":"#6B7280",borderBottom:active?"2px solid #5B21B6":"2px solid transparent",cursor:"pointer"}},t.s,cYids.has(t.id)?" ⚠":"");}),
        h("div",{style:{width:1,background:"#EDE9FE",margin:"7px 8px"}}),
        h("span",{style:{alignSelf:"center",fontSize:10,color:"#9CA3AF",fontWeight:600,padding:"0 2px",whiteSpace:"nowrap"}},"תואר שני"),
        msc.map(t=>{const active=ay===t.id&&view==="schedule";return h("button",{key:t.id,onClick:()=>{sAy(t.id);sView("schedule");},style:{padding:"9px 9px",border:"none",background:"none",fontSize:11,fontWeight:600,whiteSpace:"nowrap",color:active?"#5B21B6":"#6B7280",borderBottom:active?"2px solid #5B21B6":"2px solid transparent",cursor:"pointer"}},t.s,cYids.has(t.id)?" ⚠":"");}))),
    h("div",{style:{padding:"12px 12px 24px"}},
      h("div",{style:{display:"flex",gap:7,marginBottom:11,alignItems:"center",flexWrap:"wrap"}},
        [{id:"schedule",l:"📋 מערכת שעות"},{id:"stats",l:"📊 שעות סגל"},{id:"conflicts",l:"⚠ חפיפות ("+cfls.length+")"}].map(t=>h("button",{key:t.id,onClick:()=>sView(t.id),style:{padding:"6px 12px",borderRadius:8,border:view===t.id?"none":"1px solid #DDD6FE",background:view===t.id?"linear-gradient(135deg,#7C3AED,#4C1D95)":"#fff",color:view===t.id?"#fff":"#5B21B6",fontSize:12,fontWeight:600,cursor:"pointer"}},t.l)),
        h("div",{style:{flex:1}}),
        h("button",{onClick:()=>setColorsModal(true),style:{padding:"5px 12px",borderRadius:8,border:"1px solid #DDD6FE",background:"#fff",color:"#374151",fontSize:11,fontWeight:600}},"🎨 סגל"),
        h("button",{onClick:()=>setBackup(true),style:{padding:"5px 12px",borderRadius:8,border:"1px solid #D1FAE5",background:"#F0FDF4",color:"#059669",fontSize:11,fontWeight:600}},"💾 גיבוי"),
        h("div",{style:{position:"relative"}},
          h("button",{onClick:()=>setPdf(!pdfOpen),style:{padding:"5px 12px",borderRadius:8,border:"1px solid #DDD6FE",background:"#fff",color:"#5B21B6",fontSize:11,fontWeight:600}},"🖨️ PDF ▾"),
          pdfOpen&&h("div",{style:{position:"absolute",top:"110%",left:0,background:"#fff",border:"1px solid #DDD6FE",borderRadius:10,boxShadow:"0 8px 24px rgba(0,0,0,0.12)",zIndex:100,minWidth:260,maxHeight:400,overflowY:"auto",overflow:"hidden auto",direction:"rtl"}},
            pdfItems.map((item,i)=>item.fn?h("button",{key:i,onClick:()=>{item.fn();setPdf(false);},style:{width:"100%",padding:"9px 14px",border:"none",background:"none",textAlign:"right",fontSize:11,color:"#374151",cursor:"pointer",borderBottom:"1px solid #F3F4F6",fontFamily:"inherit"},onMouseEnter:e=>e.currentTarget.style.background="#F5F3FF",onMouseLeave:e=>e.currentTarget.style.background="none"},item.label):h("div",{key:i,style:{padding:"5px 14px",fontSize:10,color:"#9CA3AF",background:"#FAFAFA",borderBottom:"1px solid #F3F4F6",fontWeight:600}},item.label))))),
      view==="schedule"&&h("div",{style:{background:"#fff",borderRadius:10,padding:"9px 14px",marginBottom:10,border:"0.5px solid #EDE9FE",display:"flex",flexWrap:"wrap",gap:5,alignItems:"center"}},
        h("span",{style:{fontSize:10,color:"#9CA3AF",fontWeight:600}},"סגל:"),
        Object.entries(sc).map(([n,v])=>h("span",{key:n,style:{background:v.bg,color:v.c,borderRadius:99,padding:"2px 9px",fontSize:11,fontWeight:600,border:"1px solid "+v.c+"25"}},v.full||n))),
      h("div",{style:{background:"#fff",borderRadius:13,border:"0.5px solid #EDE9FE",overflow:"hidden"}},
        view==="schedule"&&h(Grid,{yid:ay,sched,banners,sc,zoomDays,cSet,onEdit:(d,sH,c)=>sModal({day:d,startH:sH,cell:c}),onBannerEdit:(yid,cur)=>setBannerModal({yid,cur}),onToggleZoom:handleToggleZoom}),
        view==="stats"&&h(StatsPanel,{staff,sched,sc,onUpdate:handleStaffUpdate}),
        view==="conflicts"&&h(ConflictsPanel,{cfls}))),
    pdfOpen&&h("div",{style:{position:"fixed",inset:0,zIndex:99},onClick:()=>setPdf(false)}),
    modal&&h(EditModal,{day:modal.day,startH:modal.startH,cell:modal.cell,yid:ay,sc,onSave:handleSave,onDelete:handleDelete,onClose:()=>sModal(null)}),
    bannerModal&&h(BannerModal,{yid:bannerModal.yid,current:bannerModal.cur,onSave:handleBannerSave,onClose:()=>setBannerModal(null)}),
    colorsModal&&h(StaffColorsModal,{sc,onSave:handleScSave,onClose:()=>setColorsModal(false)}),
    backupOpen&&h(BackupModal,{acY,sched,staff,banners,sc,zoomDays,onRestore:handleRestore,onClose:()=>setBackup(false)}));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
