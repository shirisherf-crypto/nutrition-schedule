async function dbLoad(id){
  try{
    const {data,error} = await sb.from("schedule_data").select("data").eq("id",id).single();
    if(error||!data||!data.data||Object.keys(data.data).length===0) return null;
    return data.data;
  }catch(e){return null;}
}
async function dbSave(id,d){
  try{
    const {error} = await sb.from("schedule_data").upsert({id,data:d,updated_at:new Date().toISOString()});
    return !error;
  }catch(e){return false;}
}
function dbSub(id,cb){
  return sb.channel("ch_"+id)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"schedule_data"},p=>{
      if(p.new&&p.new.id===id&&p.new.data) cb(p.new.data);
    }).subscribe();
}

function calcTotals(staff){
  return staff.map(s=>{
    const ss = [...s.courses,...s.ext,...s.bonuses].reduce((a,c)=>a+(parseFloat(c.ss)||0),0);

  });
}

  const seen=new Set();

}

function BackupModal({acY,sched,staff,banners,onRestore,onClose}){
  const[mode,setMode]=useState("menu");
  const[msg,setMsg]=useState("");

  const doExport=()=>{
    const yk=getYK(acY);
    const backup={year:acY,yearKey:yk,date:new Date().toISOString(),sched,staff,banners};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="backup_"+yk+"_"+new Date().toLocaleDateString("he-IL").replace(/\//g,"-")+".json";
    a.click();URL.revokeObjectURL(url);
    setMsg("הגיבוי הורד בהצלחה!");
  };

  const doImport=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.sched||!data.staff)throw new Error("קובץ לא תקין");
        onRestore(data);
        setMsg("השחזור הצליח! הנתונים נטענו.");
      }catch(err){setMsg("שגיאה: "+err.message);}
    };
    reader.readAsText(file);
  };

  return h("div",{style:{position:"relative",zIndex:50}},
    h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)"},onClick:onClose}),
    h("div",{style:{position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",background:"#fff",borderRadius:16,padding:24,width:380,maxWidth:"94vw",zIndex:51,direction:"rtl",boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},
        h("div",{style:{fontWeight:700,fontSize:15,color:"#3B0764"}},"גיבוי ושחזור"),
        h("button",{onClick:onClose,style:{background:"none",border:"none",fontSize:20,color:"#9CA3AF"}},"✕")),
      h("div",{style:{fontSize:11,color:"#6B7280",marginBottom:16,background:"#F9FAFB",borderRadius:8,padding:"10px 12px",lineHeight:1.6}},
        h("div",{style:{fontWeight:600,color:"#374151",marginBottom:4}},"איך עובד:"),
        h("div",null,"1. לפני כל עדכון קובץ — לחצי גיבוי"),
        h("div",null,"2. הקובץ יישמר במחשב שלך"),
        h("div",null,"3. אם משהו השתבש — לחצי שחזור ובחרי את הקובץ")),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}},
        h("button",{onClick:doExport,style:{padding:"14px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#059669,#065F46)",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}},
          h("div",{style:{fontSize:20,marginBottom:4}},"⬇️"),
          h("div",null,"גיבוי"),
          h("div",{style:{fontSize:10,opacity:.8}},"הורד קובץ JSON")),
        h("label",{style:{padding:"14px",borderRadius:10,border:"2px dashed #7C3AED",background:"#F5F3FF",color:"#5B21B6",fontSize:13,fontWeight:700,cursor:"pointer",textAlign:"center",display:"block"}},
          h("div",{style:{fontSize:20,marginBottom:4}},"⬆️"),
          h("div",null,"שחזור"),
          h("div",{style:{fontSize:10,opacity:.8}},"בחר קובץ JSON"),
          h("input",{type:"file",accept:".json",onChange:doImport,style:{display:"none"}}))),
      msg&&h("div",{style:{padding:"10px 12px",borderRadius:8,background:msg.includes("שגיאה")?"#FEF2F2":"#F0FDF4",color:msg.includes("שגיאה")?"#991B1B":"#166534",fontSize:12,fontWeight:600,textAlign:"center"}},msg)));
}

            pdfItems.map((item,i)=>item.fn
              ?h("button",{key:i,onClick:()=>{item.fn();setPdf(false);},style:{width:"100%",padding:"9px 14px",border:"none",background:"none",textAlign:"right",fontSize:11,color:"#374151",cursor:"pointer",borderBottom:"1px solid #F3F4F6",fontFamily:"inherit"},onMouseEnter:e=>e.currentTarget.style.background="#F5F3FF",onMouseLeave:e=>e.currentTarget.style.background="none"},item.label)
              :h("div",{key:i,style:{padding:"5px 14px",fontSize:10,color:"#9CA3AF",background:"#FAFAFA",borderBottom:"1px solid #F3F4F6",fontWeight:600}},item.label)))),
        h("button",{onClick:()=>{if(window.confirm("לאפס לנתוני המקור?")){const yk=getYK(acY);dbSave("sched_"+yk,freshSched()).then(()=>{setSched(freshSched());dbSave("banners_"+yk,freshBanners()).then(()=>setBanners(freshBanners()));});}},style:{padding:"5px 11px",borderRadius:8,border:"1px solid #FCA5A5",background:"#FEF2F2",color:"#EF4444",fontSize:11,fontWeight:600}},"↺ איפוס")),
      view==="schedule"&&h("div",{style:{background:"#fff",borderRadius:10,padding:"9px 14px",marginBottom:10,border:"0.5px solid #EDE9FE",display:"flex",flexWrap:"wrap",gap:5,alignItems:"center"}},
        h("span",{style:{fontSize:10,color:"#9CA3AF",fontWeight:600}},"סגל:"),
        Object.entries(CL).map(([n,l])=>h("span",{key:n,style:{background:l.bg,color:l.c,borderRadius:99,padding:"2px 9px",fontSize:11,fontWeight:600,border:"1px solid "+l.c+"25"}},n)),
        h("span",{style:{fontSize:10,color:"#0369A1",background:"#DBEFFE",borderRadius:99,padding:"2px 8px",marginRight:6}},"|  כחול = ZOOM")),
      h("div",{style:{background:"#fff",borderRadius:13,border:"0.5px solid #EDE9FE",overflow:"hidden"}},
        view==="schedule"&&h(Grid,{yid:ay,data:sched,banners:banners,cSet:cSet,onEdit:(d,sH,c)=>sModal({day:d,startH:sH,cell:c}),onBannerEdit:(yid,cur)=>setBannerModal({yid,cur})}),
        view==="stats"&&h(StatsPanel,{staff:staff,onUpdate:handleStaffUpdate}),
        view==="conflicts"&&h(ConflictsPanel,{cfls:cfls}))),
    pdfOpen&&h("div",{style:{position:"fixed",inset:0,zIndex:99},onClick:()=>setPdf(false)}),
    backupOpen&&h(BackupModal,{acY,sched,staff,banners,onRestore:handleRestore,onClose:()=>setBackup(false)}),
    modal&&h(EditModal,{day:modal.day,startH:modal.startH,cell:modal.cell,yid:ay,onSave:handleSave,onDelete:handleDelete,onClose:()=>sModal(null)}),
    bannerModal&&h(BannerModal,{yid:bannerModal.yid,current:bannerModal.cur,onSave:handleBannerSave,onClose:()=>setBannerModal(null)}));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
</body>
</html>
